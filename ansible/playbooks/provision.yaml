- hosts: workstations
  become: true

  tasks:
    # Set first: rtcwake's wake time and other timers are read in the
    # system timezone. If it changes, re-run set-wake (a handler from the
    # rtcwake role, imported below) so the armed alarm moves too.
    - name: Set system timezone
      community.general.timezone:
        name: "{{ system_timezone }}"
      notify: Run set-wake
      tags: [timezone]

    # Machine-wide preferences only (location services). Called without a
    # user, so the role's per-user editor/gitconfig tasks are skipped.
    - name: Configure system preferences
      ansible.builtin.import_role:
        name: preferences
      tags: [preferences]

    # Base software and user creation
    - name: Create configured users
      ansible.builtin.import_role:
        name: users
      tags: [users]

    - name: Install apt packages
      ansible.builtin.import_role:
        name: apt_packages
      tags: [apt_packages]
      
    - name: Install base snap packages
      ansible.builtin.import_role:
        name: snap_packages
      tags: [snap_packages]

    # Data Sync (rtcwake and syncthing)
    - name: Install and configure rtcwake
      ansible.builtin.import_role:
        name: rtcwake
      tags: [rtcwake]

    - name: Install and configure Syncthing
      ansible.builtin.include_role:
        name: syncthing
        apply:
          tags: [syncthing]
      loop: "{{ users | default([]) | selectattr('syncthing', 'defined') | list }}"
      loop_control:
        loop_var: syncthing_user_config
      vars:
        syncthing_user: "{{ syncthing_user_config.username }}"
        syncthing_port: "{{ syncthing_user_config.syncthing.port }}"
        syncthing_directory: "{{ syncthing_user_config.syncthing.directory }}"
      tags: [syncthing]

    # Installs the engine and adds docker_users to the docker group -
    # both handled natively by this role, reading docker_users straight
    # out of group_vars/all.yaml like any other play variable.
    - name: Install Docker
      ansible.builtin.import_role:
        name: geerlingguy.docker
      tags: [docker]

    # libvirt/QEMU/GNOME Boxes, and adds libvirt_users to the libvirt
    # group. Skipped on machines that are themselves VMs (nested
    # virtualization isn't worth it there).
    - name: Install KVM and libvirt
      ansible.builtin.import_role:
        name: kvmhosts
      when: ansible_facts['virtualization_role'] | default('host') != 'guest'
      tags: [kvmhosts]
