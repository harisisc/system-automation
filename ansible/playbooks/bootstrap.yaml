---
# Run once against a freshly autoinstalled machine, before it's promoted
# from the bootstrap group to workstations (see inventory/hosts.yaml).
#
# ansible-playbook playbooks/bootstrap.yaml --limit 192.168.1.91
- name: Bootstrap a freshly autoinstalled machine
  hosts: bootstrap
  become: true

  vars_prompt:
    - name: target_hostname
      prompt: "Hostname for this machine"
      private: false
    - name: user_password
      prompt: "Initial password for user accounts (forced to change at first login)"
      private: true
      confirm: true

  tasks:
    - name: Create configured users
      ansible.builtin.include_role:
        name: users
        apply:
          tags: [users]
      tags: [users]

    # Full patch, not the curated apt_packages/snap_packages lists -
    # that's provision.yaml's job, once this host is promoted to
    # workstations. Just get the base system current before anything
    # else lands on it.
    - name: Update apt, snap, and flatpak packages
      ansible.builtin.include_role:
        name: system_update
        apply:
          tags: [system_update]
      tags: [system_update]

    - name: Set hostname
      ansible.builtin.include_role:
        name: hostname
        apply:
          tags: [hostname]
      tags: [hostname]

    # Installs Tailscale but leaves it unauthenticated - run `sudo tailscale
    # up` on the machine yourself to connect it to your tailnet.
    - name: Install Tailscale
      ansible.builtin.include_role:
        name: artis3n.tailscale.machine
        apply:
          tags: [tailscale]
      vars:
        tailscale_up_skip: true
      tags: [tailscale]
