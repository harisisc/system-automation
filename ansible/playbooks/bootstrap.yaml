---
# Run once against a freshly autoinstalled machine, before it's promoted
# from the bootstrap group to workstations (see inventory/hosts.yaml).
#
# ansible-playbook playbooks/bootstrap.yaml --limit 192.168.1.91
- name: Bootstrap a freshly autoinstalled machine
  hosts: bootstrap
  become: true

  vars_prompt:
    - name: target_hostname
      prompt: "Hostname for this machine"
      private: false
    - name: user_password
      prompt: "Initial password for user accounts (forced to change at first login)"
      private: true
      confirm: true

  tasks:
    - name: Create configured users
      ansible.builtin.include_role:
        name: users
        apply:
          tags: [users]
      tags: [users]

    # Full patch before installing anything else, so the rest of this
    # play lands on a current base rather than whatever the ISO snapshot
    # happened to ship with.
    - name: Update apt, snap, and flatpak packages
      ansible.builtin.include_role:
        name: system_update
        apply:
          tags: [system_update]
      tags: [system_update]

    - name: Install apt packages
      ansible.builtin.include_role:
        name: apt_packages
        apply:
          tags: [apt_packages]
      tags: [apt_packages]

    - name: Install base snap packages
      ansible.builtin.include_role:
        name: snap_packages
        apply:
          tags: [snap_packages]
      tags: [snap_packages]

    - name: Set hostname
      ansible.builtin.include_role:
        name: hostname
        apply:
          tags: [hostname]
      tags: [hostname]

    # Installs Tailscale but leaves it unauthenticated - run `sudo tailscale
    # up` on the machine yourself to connect it to your tailnet.
    - name: Install Tailscale
      ansible.builtin.include_role:
        name: artis3n.tailscale.machine
        apply:
          tags: [tailscale]
      vars:
        tailscale_up_skip: true
      tags: [tailscale]
