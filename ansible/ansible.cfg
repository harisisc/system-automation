[defaults]
# Path to the inventory source.
inventory = ./inventory/hosts

# Default path where Ansible looks for roles.
roles_path = ./roles:./roles_external

# Disable host key checking for easier local/lab automation.
# Set to True in production if strict SSH trust is required.
host_key_checking = False

# Disable retry files (*.retry) generation.
retry_files_enabled = False

# Use YAML output callback for cleaner play output.
stdout_callback = yaml

# Keep output focused and readable.
bin_ansible_callbacks = True

#collections_paths = ./collections
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections

[inventory]
# Ignore these file patterns when loading inventory directories.
# Keep this empty unless you need regex-based filtering.

[privilege_escalation]
# Do not escalate by default; enable per playbook/play with `become: true`.
become = False
become_method = sudo
become_ask_pass = False

[ssh_connection]
# Reuse SSH connections to speed up repeated tasks.
pipelining = False
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
