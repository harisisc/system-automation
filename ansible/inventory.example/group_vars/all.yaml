ansible_user: ansible
ansible_ssh_private_key_file: ~/.ssh/ansible_ed25519

# System timezone for every machine. Keep in sync with timezone: in
# ../autoinstall/autoinstall.yaml.template.
system_timezone: America/New_York

users:
  - username: jsmith
    fullname: "Jane Smith"
    syncthing:
      port: 8384      # GUI, on 127.0.0.1 only
      sync_port: 22000 # sync, opened to the LAN; one per user
    git:
      user_name: jsmith
      user_email: jane.smith@example.com

  - username: bsmith
    fullname: "Bob Smith"
    syncthing:
      port: 8385
      sync_port: 22001

docker_users:
   - jsmith

libvirt_users:
   - jsmith
