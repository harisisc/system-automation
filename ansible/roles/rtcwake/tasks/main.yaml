---
# Daily wake from suspend via a systemd timer with WakeSystem=true. The
# kernel re-arms the RTC alarm on every suspend, so the wake can't get
# lost after the first night (the old boot-time rtcwake script could).

- name: Install daily wake service
  ansible.builtin.template:
    src: daily-wake.service.j2
    dest: /etc/systemd/system/daily-wake.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install daily wake timer
  ansible.builtin.template:
    src: daily-wake.timer.j2
    dest: /etc/systemd/system/daily-wake.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart wake timer

# Pick up new unit files before enabling/starting the timer below.
- name: Apply systemd changes before enabling the timer
  ansible.builtin.meta: flush_handlers

- name: Enable and start daily wake timer
  ansible.builtin.systemd:
    name: daily-wake.timer
    enabled: true
    state: started

# Remove the previous boot-time rtcwake setup (set-wake.service +
# set-wake.sh) from machines that still have it.
- name: Check for the old set-wake service
  ansible.builtin.stat:
    path: /etc/systemd/system/set-wake.service
  register: rtcwake_legacy_unit

- name: Disable the old set-wake service
  ansible.builtin.systemd:
    name: set-wake.service
    enabled: false
  when: rtcwake_legacy_unit.stat.exists

- name: Remove the old set-wake files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/set-wake.service
    - /usr/local/bin/set-wake.sh
  notify: Reload systemd

# The old script left an alarm armed in the RTC. Clear it; the timer
# arms its own on the next suspend.
- name: Clear the alarm the old script armed
  ansible.builtin.shell: echo 0 > /sys/class/rtc/rtc0/wakealarm
  when: rtcwake_legacy_unit.stat.exists
  changed_when: true
