---
- name: Ensure util-linux is installed (rtcwake)
  ansible.builtin.package:
    name: util-linux
    state: present

- name: Install wake script
  ansible.builtin.template:
    src: set-wake.sh.j2
    dest: /usr/local/bin/set-wake.sh
    owner: root
    group: root
    mode: '0755'
  notify: Run set-wake

- name: Install systemd service
  ansible.builtin.template:
    src: set-wake.service.j2
    dest: /etc/systemd/system/set-wake.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Run set-wake

# Only enabled here, not started: it's a oneshot, so `state: started`
# would re-run it (and report "changed") on every provision. The handlers
# run it once whenever the script or unit actually changes, and it runs
# at every boot.
- name: Enable wake service
  ansible.builtin.systemd:
    name: set-wake.service
    enabled: true
