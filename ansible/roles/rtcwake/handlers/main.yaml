---
# Handlers run in the order listed here, so systemd picks up changed
# unit files before the timer is restarted.
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

# Restarting the timer recalculates its next elapse time, e.g. after the
# wake time or the system timezone changes.
- name: Restart wake timer
  ansible.builtin.systemd:
    name: daily-wake.timer
    state: restarted
