---
# import_tasks (not include_tasks) so tags on the role reach every task.

# Shared dconf setup, needed by everything below.
- name: Set up dconf system defaults
  ansible.builtin.import_tasks: dconf.yaml

# Machine-wide, runs on every call.
- name: Enable location services
  ansible.builtin.import_tasks: location.yaml

- name: Set power defaults
  ansible.builtin.import_tasks: power.yaml
