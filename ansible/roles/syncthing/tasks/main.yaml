---
- name: Require Syncthing user
  ansible.builtin.assert:
    that:
      - syncthing_user | length > 0
      - syncthing_port | string | length > 0
    fail_msg: Set syncthing_user and syncthing_port when including the syncthing role.

- name: Install Syncthing
  ansible.builtin.import_tasks: install.yaml

- name: Configure Syncthing
  ansible.builtin.import_tasks: config.yaml

- name: Install the user's .stignore if missing
  ansible.builtin.import_tasks: stignore.yaml

- name: Configure Syncthing services
  ansible.builtin.import_tasks: service.yaml

- name: Open Syncthing ports in the firewall
  ansible.builtin.import_tasks: firewall.yaml
