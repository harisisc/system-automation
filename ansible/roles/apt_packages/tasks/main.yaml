---
# Full apt upgrades are the system_update role's job (run fleet-wide,
# independent of this role) - this just keeps the cache fresh enough to
# install from.
- name: Install apt packages
  ansible.builtin.apt:
    name: "{{ apt_packages_list + apt_packages_extra }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
