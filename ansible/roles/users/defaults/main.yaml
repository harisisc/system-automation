---
users: []
# Baseline groups every configured user gets, independent of any specific
# software - matches Ubuntu's own installer defaults for the first admin
# user. Software-specific groups (docker, libvirt, ...) are deliberately
# NOT here - they can't exist until that software is installed, so each
# one is added by that software's own role instead, after install, the
# same way the docker role already does it.
user_default_groups:
  - sudo
  - adm
  - cdrom
  - dip
  - plugdev
  - lpadmin
# Shared initial password for newly created accounts - forced to change
# at first login (see "Force password change at next login" below).
# Left empty, this role won't touch any existing account's password, and
# new accounts are created locked (no password) - intentional for users
# added after bootstrap. Set one by hand with `sudo passwd <user>`.
user_password: ""
# Where <username>.png avatar pictures are read from, on the control
# machine. inventory_dir is the folder of the inventory file the host is
# defined in, so a host defined in a different inventory file (e.g. a
# one-off test inventory) needs this set with -e.
users_avatar_dir: "{{ inventory_dir }}/group_vars/avatars"
