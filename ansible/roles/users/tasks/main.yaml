---
- name: Create configured users
  ansible.builtin.user:
    name: "{{ item.username }}"
    state: present
    system: false
    shell: /bin/bash
    create_home: true
    groups:
      - sudo
    append: true
    password: "{{ item.password_hash | default(omit) }}"
  loop: "{{ users }}"

- name: Remove default Ubuntu installer user
  ansible.builtin.user:
    name: ubuntu
    state: absent
    remove: true
    force: true
  when: "'ubuntu' not in users | map(attribute='username') | list"

- name: Remove default Ubuntu installer group
  ansible.builtin.group:
    name: ubuntu
    state: absent
  when: "'ubuntu' not in users | map(attribute='username') | list"
