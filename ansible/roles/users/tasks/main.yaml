---
- name: Create configured users
  ansible.builtin.user:
    name: "{{ item.username }}"
    state: present
    system: false
    shell: /bin/bash
    create_home: true
    groups:
      - sudo
    append: true
    password: "{{ (user_password | password_hash('sha512')) if user_password else omit }}"
  loop: "{{ users }}"

# Only when a fresh user_password was actually set above - re-running this
# role to reconcile accounts (e.g. via provision.yaml) shouldn't keep
# re-expiring passwords people have already changed.
- name: Force password change at next login
  ansible.builtin.command: passwd --expire {{ item.username }}
  loop: "{{ users }}"
  when: user_password | length > 0
  changed_when: true

- name: Remove default Ubuntu installer user
  ansible.builtin.user:
    name: ubuntu
    state: absent
    remove: true
    force: true
  when: "'ubuntu' not in users | map(attribute='username') | list"

- name: Remove default Ubuntu installer group
  ansible.builtin.group:
    name: ubuntu
    state: absent
  when: "'ubuntu' not in users | map(attribute='username') | list"
