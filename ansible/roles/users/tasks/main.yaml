---
# Read-only, so this should run for real even under --check - needed to
# tell "just created this run" apart from "already existed" below.
- name: Check which configured users already exist
  ansible.builtin.command: getent passwd {{ item.username }}
  loop: "{{ users }}"
  register: existing_users_check
  check_mode: false
  failed_when: false
  changed_when: false

- name: Create configured users
  ansible.builtin.user:
    name: "{{ item.username }}"
    comment: "{{ item.fullname | default(omit) }}"
    state: present
    system: false
    shell: /bin/bash
    create_home: true
    groups: "{{ user_default_groups }}"
    append: true
    password: "{{ (user_password | password_hash('sha512')) if user_password else omit }}"
    # Only ever set the password at account creation - without this,
    # bootstrap.yaml's always-prompted user_password would overwrite
    # someone's real, already-changed password on every re-run.
    update_password: on_create
  loop: "{{ users }}"

# Only for accounts that didn't already exist before this run (per the
# getent check above), and only when a fresh user_password was actually
# set - re-running this role to reconcile accounts (e.g. via
# provision.yaml, or a second bootstrap.yaml run) shouldn't keep
# re-expiring passwords people have already changed.
- name: Force password change at next login for newly created users
  ansible.builtin.command: passwd --expire {{ item.item.username }}
  loop: "{{ existing_users_check.results }}"
  when: user_password | length > 0 and item.rc != 0
  changed_when: true

# Optional per-user - avatars are real photos, so they're never committed
# (inventory/group_vars/avatars/ is gitignored). Drop <username>.png in
# users_avatar_dir (see defaults) yourself; users without a file there are
# just skipped, no error. If the directory itself is missing, a message
# says so, since that usually means the path is wrong.
#
# Setting the picture requires AccountsService's own SetIconFile dbus call,
# not just dropping a file in place:
# - Writing straight to ~/.face (a fresh account's Icon= default) doesn't
#   work because home dirs are 750 - gdm can't traverse into the directory
#   to read it, regardless of the file's own permissions (confirmed on a
#   real bootstrapped machine).
# - Writing straight to the "conventional" icons/ path doesn't help either
#   unless Icon= is actually repointed there - a fresh account's Icon=
#   still defaults to the unreachable ~/.face path.
# - SetIconFile is the fix for both: it copies its source file into icons/
#   itself (root:root, world-readable) and repoints Icon= there - the same
#   thing GNOME's own "change avatar" UI does. But it also hard-rejects
#   anything much over ~1MB, so real photos need resizing first.
- name: Report a missing avatar directory
  ansible.builtin.debug:
    msg: >-
      No avatar directory at {{ users_avatar_dir }}, so no user pictures
      are set. Override with -e users_avatar_dir=<path> if it's elsewhere.
  when: users_avatar_dir is not directory

- name: Reset the list of pictures to set
  ansible.builtin.set_fact:
    avatar_users_changed: []

- name: Find users with an avatar picture
  ansible.builtin.set_fact:
    avatar_users: >-
      {{ users | map(attribute='username')
         | intersect(query('ansible.builtin.fileglob', users_avatar_dir ~ '/*.png')
                     | map('basename') | map('splitext') | map('first')) }}

# From here on, only users whose picture actually changed are touched: the
# resized image is compared with the copy AccountsService already holds in
# icons/<user> (SetIconFile stores the file as given). -strip drops the
# timestamps ImageMagick otherwise embeds, so the same source picture
# always resizes to the same bytes.
- name: Create local temp directory for resized avatar images
  ansible.builtin.tempfile:
    state: directory
    suffix: avatars
  delegate_to: localhost
  become: false
  register: avatar_tmpdir
  changed_when: false
  when: avatar_users | length > 0

- name: Resize avatar images to fit AccountsService's icon size limit
  ansible.builtin.command:
    cmd: convert {{ users_avatar_dir }}/{{ item }}.png -resize 256x256 -strip {{ avatar_tmpdir.path }}/{{ item }}.png
  delegate_to: localhost
  become: false
  loop: "{{ avatar_users }}"
  changed_when: false

- name: Checksum resized avatar images
  ansible.builtin.stat:
    path: "{{ avatar_tmpdir.path }}/{{ item }}.png"
    checksum_algorithm: sha1
  delegate_to: localhost
  become: false
  loop: "{{ avatar_users }}"
  register: avatar_resized

- name: Checksum each user's current AccountsService icon
  ansible.builtin.stat:
    path: /var/lib/AccountsService/icons/{{ item }}
    checksum_algorithm: sha1
  loop: "{{ avatar_users }}"
  register: avatar_current

- name: Work out which users' pictures need setting
  ansible.builtin.set_fact:
    avatar_users_changed: >-
      {{ avatar_users_changed | default([])
         + ([item.0.item] if item.1.stat.checksum | default('') != item.0.stat.checksum else []) }}
  loop: "{{ avatar_resized.results | zip(avatar_current.results) | list }}"
  loop_control:
    label: "{{ item.0.item }}"

- name: Upload resized avatar images to a remote temp path
  ansible.builtin.copy:
    src: "{{ avatar_tmpdir.path }}/{{ item }}.png"
    dest: "/tmp/ansible-avatar-{{ item }}.png"
    mode: "0644"
  loop: "{{ avatar_users_changed }}"

- name: Set user login/profile picture via AccountsService's own SetIconFile call
  ansible.builtin.shell: >
    busctl --system call org.freedesktop.Accounts
    /org/freedesktop/Accounts/User$(id -u {{ item }})
    org.freedesktop.Accounts.User SetIconFile s /tmp/ansible-avatar-{{ item }}.png
  loop: "{{ avatar_users_changed }}"
  changed_when: true

- name: Remove remote temp avatar files
  ansible.builtin.file:
    path: "/tmp/ansible-avatar-{{ item }}.png"
    state: absent
  loop: "{{ avatar_users_changed }}"

- name: Remove local temp directory for resized avatar images
  ansible.builtin.file:
    path: "{{ avatar_tmpdir.path }}"
    state: absent
  delegate_to: localhost
  become: false
  changed_when: false
  when: avatar_tmpdir.path is defined
