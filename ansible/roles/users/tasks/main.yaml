---
# Read-only, so this should run for real even under --check - needed to
# tell "just created this run" apart from "already existed" below.
- name: Check which configured users already exist
  ansible.builtin.command: getent passwd {{ item.username }}
  loop: "{{ users }}"
  register: existing_users_check
  check_mode: false
  failed_when: false
  changed_when: false

- name: Create configured users
  ansible.builtin.user:
    name: "{{ item.username }}"
    comment: "{{ item.fullname | default(omit) }}"
    state: present
    system: false
    shell: /bin/bash
    create_home: true
    groups: "{{ user_default_groups }}"
    append: true
    password: "{{ (user_password | password_hash('sha512')) if user_password else omit }}"
    # Only ever set the password at account creation - without this,
    # bootstrap.yaml's always-prompted user_password would overwrite
    # someone's real, already-changed password on every re-run.
    update_password: on_create
  loop: "{{ users }}"

# Only for accounts that didn't already exist before this run (per the
# getent check above), and only when a fresh user_password was actually
# set - re-running this role to reconcile accounts (e.g. via
# provision.yaml, or a second bootstrap.yaml run) shouldn't keep
# re-expiring passwords people have already changed.
- name: Force password change at next login for newly created users
  ansible.builtin.command: passwd --expire {{ item.item.username }}
  loop: "{{ existing_users_check.results }}"
  when: user_password | length > 0 and item.rc != 0
  changed_when: true

# Optional per-user - avatars are real photos, so they're never committed
# (inventory/group_vars/avatars/ is gitignored). Drop <username>.png there
# yourself; users without a file there are just skipped, no error.
#
# Written to two places, since dropping the file at the "conventional"
# icons/ path alone isn't enough - AccountsService only shows what its
# own per-user record's Icon= actually points at, and a freshly-created
# account defaults that to ~/.face (confirmed on a real bootstrapped
# machine), not the icons/ path. GNOME's own "change avatar" UI writes to
# and repoints Icon= at the icons/ path instead, so keeping both covers
# a fresh account (via .face) and one already reconfigured through the
# UI (via icons/) without needing to touch AccountsService's ini file.
- name: Set user login/profile picture (AccountsService icons path)
  ansible.builtin.copy:
    src: "{{ inventory_dir }}/group_vars/avatars/{{ item.username }}.png"
    dest: "/var/lib/AccountsService/icons/{{ item.username }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ users }}"
  when: (inventory_dir + '/group_vars/avatars/' + item.username + '.png') is file

- name: Set user login/profile picture (~/.face, a fresh account's Icon= default)
  ansible.builtin.copy:
    src: "{{ inventory_dir }}/group_vars/avatars/{{ item.username }}.png"
    dest: "/home/{{ item.username }}/.face"
    owner: "{{ item.username }}"
    group: "{{ item.username }}"
    mode: "0644"
  loop: "{{ users }}"
  when: (inventory_dir + '/group_vars/avatars/' + item.username + '.png') is file

- name: Remove default Ubuntu installer user
  ansible.builtin.user:
    name: ubuntu
    state: absent
    remove: true
    force: true
  when: "'ubuntu' not in users | map(attribute='username') | list"

- name: Remove default Ubuntu installer group
  ansible.builtin.group:
    name: ubuntu
    state: absent
  when: "'ubuntu' not in users | map(attribute='username') | list"
